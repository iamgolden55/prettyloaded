<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <!-- Outer Case Shading & Specular Glow -->
    <linearGradient id="dd-body-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7CD0" />
      <stop offset="40%" stop-color="#FF4DB8" />
      <stop offset="80%" stop-color="#E6007A" />
      <stop offset="100%" stop-color="#9E0054" />
    </linearGradient>

    <linearGradient id="dd-bevel" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="15%" stop-color="#FFBCE2" stop-opacity="0.4" />
      <stop offset="85%" stop-color="#FF4DB8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#600030" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="chrome-metal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="25%" stop-color="#E2E8F0" />
      <stop offset="50%" stop-color="#94A3B8" />
      <stop offset="70%" stop-color="#F8FAFC" />
      <stop offset="85%" stop-color="#CBD5E1" />
      <stop offset="100%" stop-color="#64748B" />
    </linearGradient>

    <linearGradient id="chrome-pink-locket" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="30%" stop-color="#FF8AD4" />
      <stop offset="60%" stop-color="#FF249C" />
      <stop offset="100%" stop-color="#800040" />
    </linearGradient>

    <linearGradient id="glass-specular" x1="0%" y1="0%" x2="60%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.65" />
      <stop offset="35%" stop-color="#FFFFFF" stop-opacity="0.2" />
      <stop offset="70%" stop-color="#FFFFFF" stop-opacity="0.0" />
    </linearGradient>

    <filter id="dd-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#E6007A" flood-opacity="0.45" />
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.2" />
    </filter>

    <filter id="charm-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#000000" flood-opacity="0.35" />
    </filter>

    <radialGradient id="sparkle-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1" />
      <stop offset="40%" stop-color="#FFE4F3" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#FF4DB8" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Ground reflection shadow -->
  <ellipse cx="150" cy="280" rx="65" ry="10" fill="#000000" opacity="0.15" filter="blur(6px)" />

  <!-- Phone Case Group (Rotated 4 degrees for dynamic 3D feel) -->
  <g transform="translate(150, 142) rotate(-4) translate(-150, -142)" filter="url(#dd-shadow)">
    
    <!-- Case Base -->
    <rect x="85" y="24" width="130" height="236" rx="28" fill="url(#dd-body-grad)" stroke="url(#dd-bevel)" stroke-width="3.5" />

    <!-- Inner bumper lip -->
    <rect x="88" y="27" width="124" height="230" rx="25" fill="none" stroke="#FFCFE6" stroke-width="1" opacity="0.4" />

    <!-- Camera Plateau (Pro Triple Camera) -->
    <g transform="translate(93, 32)">
      <rect x="0" y="0" width="56" height="58" rx="14" fill="#B8005E" stroke="#FFB6DE" stroke-width="1.8" />
      <!-- Camera 1 -->
      <circle cx="17" cy="17" r="10" fill="#18181B" stroke="#E2E8F0" stroke-width="2" />
      <circle cx="17" cy="17" r="5" fill="#3B82F6" opacity="0.8" />
      <circle cx="15" cy="15" r="2" fill="#FFFFFF" opacity="0.9" />
      <!-- Camera 2 -->
      <circle cx="17" cy="41" r="10" fill="#18181B" stroke="#E2E8F0" stroke-width="2" />
      <circle cx="17" cy="41" r="5" fill="#3B82F6" opacity="0.8" />
      <circle cx="15" cy="39" r="2" fill="#FFFFFF" opacity="0.9" />
      <!-- Camera 3 -->
      <circle cx="39" cy="29" r="10" fill="#18181B" stroke="#E2E8F0" stroke-width="2" />
      <circle cx="39" cy="29" r="5" fill="#3B82F6" opacity="0.8" />
      <circle cx="37" cy="27" r="2" fill="#FFFFFF" opacity="0.9" />
      <!-- Flash & Sensor -->
      <circle cx="39" cy="12" r="3.5" fill="#FEF08A" stroke="#FFFFFF" stroke-width="1" />
      <circle cx="39" cy="47" r="2" fill="#334155" />
    </g>

    <!-- Holographic Hexagon Glitter Suspension Layer -->
    <g opacity="0.9">
      <!-- Chunky Hexagon Flakes -->
      <polygon points="170,110 178,105 186,110 186,120 178,125 170,120" fill="#38BDF8" opacity="0.75" />
      <polygon points="120,135 127,131 134,135 134,143 127,147 120,143" fill="#FACC15" opacity="0.8" />
      <polygon points="175,170 184,165 193,170 193,180 184,185 175,180" fill="#C084FC" opacity="0.75" />
      <polygon points="105,190 112,186 119,190 119,198 112,202 105,198" fill="#4ADE80" opacity="0.8" />
      <polygon points="140,215 148,210 156,215 156,225 148,230 140,225" fill="#F472B6" opacity="0.85" />
      <polygon points="180,230 186,226 192,230 192,238 186,242 180,238" fill="#38BDF8" opacity="0.7" />
      <polygon points="155,75 161,72 167,75 167,81 161,84 155,81" fill="#FFFFFF" opacity="0.9" />
      <polygon points="185,55 192,51 199,55 199,63 192,67 185,63" fill="#FACC15" opacity="0.85" />
      
      <!-- Sparkle Stars -->
      <g transform="translate(175, 80) scale(0.6)">
        <path d="M0,15 Q15,15 15,0 Q15,15 30,15 Q15,15 15,30 Q15,15 0,15" fill="#FFFFFF" />
      </g>
      <g transform="translate(110, 160) scale(0.7)">
        <path d="M0,15 Q15,15 15,0 Q15,15 30,15 Q15,15 15,30 Q15,15 0,15" fill="#FFFFFF" />
      </g>
      <g transform="translate(180, 205) scale(0.8)">
        <path d="M0,15 Q15,15 15,0 Q15,15 30,15 Q15,15 15,30 Q15,15 0,15" fill="#FFFFFF" />
      </g>
      <g transform="translate(125, 235) scale(0.5)">
        <path d="M0,15 Q15,15 15,0 Q15,15 30,15 Q15,15 15,30 Q15,15 0,15" fill="#FFFFFF" />
      </g>
      
      <!-- Stardust dots -->
      <circle cx="160" cy="140" r="1.5" fill="#FFFFFF" opacity="0.9" />
      <circle cx="170" cy="155" r="1.2" fill="#FFE4F3" opacity="0.9" />
      <circle cx="135" cy="175" r="1.8" fill="#FFFFFF" opacity="0.9" />
      <circle cx="115" cy="115" r="1.3" fill="#FFFFFF" opacity="0.8" />
      <circle cx="195" cy="145" r="1.5" fill="#FFFFFF" opacity="0.9" />
      <circle cx="145" cy="100" r="1.2" fill="#FACC15" opacity="0.9" />
      <circle cx="165" cy="220" r="1.4" fill="#38BDF8" opacity="0.9" />
    </g>

    <!-- Planetary Chrome Orbit Halo Charm -->
    <g transform="translate(150, 175) rotate(-22)" filter="url(#charm-shadow)">
      <ellipse cx="0" cy="0" rx="54" ry="14" fill="none" stroke="url(#chrome-metal)" stroke-width="4.5" />
      <ellipse cx="0" cy="0" rx="54" ry="14" fill="none" stroke="#FFFFFF" stroke-width="1.5" opacity="0.8" />
    </g>

    <!-- 3D Chrome Ribbon Bow Charm (Upper Center) -->
    <g transform="translate(150, 115)" filter="url(#charm-shadow)">
      <!-- Left loop -->
      <path d="M0,0 C-18,-24 -36,-12 -28,8 C-24,18 -8,6 0,0 Z" fill="url(#chrome-pink-locket)" stroke="#FFFFFF" stroke-width="1.2" />
      <path d="M-8,-4 C-16,-16 -26,-8 -20,4 Z" fill="#FFCFE6" opacity="0.6" />
      <!-- Right loop -->
      <path d="M0,0 C18,-24 36,-12 28,8 C24,18 8,6 0,0 Z" fill="url(#chrome-pink-locket)" stroke="#FFFFFF" stroke-width="1.2" />
      <path d="M8,-4 C16,-16 26,-8 20,4 Z" fill="#FFCFE6" opacity="0.6" />
      <!-- Ribbons tail -->
      <path d="M-4,4 C-12,18 -18,28 -14,32 C-10,32 -2,14 0,6 Z" fill="url(#chrome-metal)" />
      <path d="M4,4 C12,18 18,28 14,32 C10,32 2,14 0,6 Z" fill="url(#chrome-metal)" />
      <!-- Center Knot Heart -->
      <circle cx="0" cy="0" r="7.5" fill="url(#chrome-metal)" stroke="#FFFFFF" stroke-width="1" />
      <path d="M0,-3 C-3,-6 -6,-3 -6,0 C-6,3 0,6 0,6 C0,6 6,3 6,0 C6,-3 3,-6 0,-3 Z" fill="#E6007A" />
      <!-- Hanging jewel charm chain -->
      <line x1="0" y1="6" x2="0" y2="18" stroke="url(#chrome-metal)" stroke-width="1.8" />
      <circle cx="0" cy="20" r="4.5" fill="#FF249C" stroke="#FFFFFF" stroke-width="1" />
    </g>

    <!-- Faceted Ruby/Rose Crystal Heart (Lower Center) -->
    <g transform="translate(150, 168)" filter="url(#charm-shadow)">
      <!-- Chrome bezel frame -->
      <path d="M0,-14 C-14,-28 -28,-14 -28,4 C-28,18 0,32 0,32 C0,32 28,18 28,4 C28,-14 14,-28 0,-14 Z" fill="url(#chrome-metal)" stroke="#FFFFFF" stroke-width="1.5" />
      <!-- Faceted Crystal Jewel -->
      <path d="M0,-10 C-10,-20 -20,-10 -20,3 C-20,13 0,24 0,24 C0,24 20,13 20,3 C20,-10 10,-20 0,-10 Z" fill="#FF1493" />
      <polygon points="0,-10 -8,-3 0,6 8,-3" fill="#FF69B4" opacity="0.8" />
      <polygon points="0,6 -10,3 0,24" fill="#C71585" opacity="0.9" />
      <polygon points="0,6 10,3 0,24" fill="#99004C" opacity="0.9" />
      <polygon points="0,-10 -15,-6 -8,-3" fill="#FFFFFF" opacity="0.75" />
    </g>

    <!-- Chrome 3D Y2K Star Accent -->
    <g transform="translate(188, 140) scale(0.75)" filter="url(#charm-shadow)">
      <polygon points="0,-16 4,-4 16,0 4,4 0,16 -4,4 -16,0 -4,-4" fill="url(#chrome-metal)" stroke="#FFFFFF" stroke-width="1.2" />
    </g>

    <!-- High-Gloss Optical Glass Sheen Reflection Sweep -->
    <path d="M88,27 L185,27 L110,257 L88,257 Z" fill="url(#glass-specular)" pointer-events="none" />
    
    <!-- Top corner rim light highlight -->
    <path d="M90,40 C90,32 96,27 105,27 L180,27" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.85" />
  </g>
</svg>
