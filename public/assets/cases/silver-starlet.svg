<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <!-- Liquid Chrome Shading -->
    <linearGradient id="ss-body-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="25%" stop-color="#E2E8F0" />
      <stop offset="50%" stop-color="#94A3B8" />
      <stop offset="70%" stop-color="#F1F5F9" />
      <stop offset="85%" stop-color="#CBD5E1" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>

    <linearGradient id="ss-bevel" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="20%" stop-color="#CBD5E1" stop-opacity="0.5" />
      <stop offset="80%" stop-color="#94A3B8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#334155" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="mirror-streak" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.75" />
      <stop offset="30%" stop-color="#FFFFFF" stop-opacity="0.1" />
      <stop offset="70%" stop-color="#FFFFFF" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0" />
    </linearGradient>

    <filter id="ss-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#64748B" flood-opacity="0.4" />
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.25" />
    </filter>

    <filter id="charm-shadow-ss" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Ground reflection shadow -->
  <ellipse cx="150" cy="280" rx="65" ry="10" fill="#000000" opacity="0.15" filter="blur(6px)" />

  <!-- Phone Case Group -->
  <g transform="translate(150, 142) rotate(3) translate(-150, -142)" filter="url(#ss-shadow)">
    
    <!-- Case Base -->
    <rect x="85" y="24" width="130" height="236" rx="28" fill="url(#ss-body-grad)" stroke="url(#ss-bevel)" stroke-width="3.5" />

    <!-- Inner bumper lip -->
    <rect x="88" y="27" width="124" height="230" rx="25" fill="none" stroke="#FFFFFF" stroke-width="1.2" opacity="0.6" />

    <!-- Camera Plateau (Samsung Ultra Style Vertical array) -->
    <g transform="translate(94, 34)">
      <!-- Lens 1 -->
      <circle cx="16" cy="14" r="11" fill="#0F172A" stroke="#E2E8F0" stroke-width="2.5" />
      <circle cx="16" cy="14" r="5" fill="#38BDF8" opacity="0.8" />
      <circle cx="14" cy="12" r="2" fill="#FFFFFF" />
      <!-- Lens 2 -->
      <circle cx="16" cy="40" r="11" fill="#0F172A" stroke="#E2E8F0" stroke-width="2.5" />
      <circle cx="16" cy="40" r="5" fill="#38BDF8" opacity="0.8" />
      <circle cx="14" cy="38" r="2" fill="#FFFFFF" />
      <!-- Lens 3 -->
      <circle cx="16" cy="66" r="11" fill="#0F172A" stroke="#E2E8F0" stroke-width="2.5" />
      <circle cx="16" cy="66" r="5" fill="#38BDF8" opacity="0.8" />
      <circle cx="14" cy="64" r="2" fill="#FFFFFF" />
      <!-- Secondary sensors -->
      <circle cx="36" cy="27" r="6" fill="#1E293B" stroke="#CBD5E1" stroke-width="1.5" />
      <circle cx="36" cy="53" r="5" fill="#F8FAFC" />
    </g>

    <!-- Starlight Foil Silver Glitters Layer -->
    <g opacity="0.95">
      <!-- Metallic Foil Stars -->
      <g transform="translate(170, 70) scale(0.9)">
        <polygon points="0,-10 3,-3 10,0 3,3 0,10 -3,3 -10,0 -3,-3" fill="#FFFFFF" stroke="#94A3B8" stroke-width="0.8" />
      </g>
      <g transform="translate(145, 115) scale(0.7)">
        <polygon points="0,-10 3,-3 10,0 3,3 0,10 -3,3 -10,0 -3,-3" fill="#FFFFFF" stroke="#94A3B8" stroke-width="0.8" />
      </g>
      <g transform="translate(185, 160) scale(0.85)">
        <polygon points="0,-10 3,-3 10,0 3,3 0,10 -3,3 -10,0 -3,-3" fill="#FFFFFF" stroke="#94A3B8" stroke-width="0.8" />
      </g>
      <g transform="translate(115, 185) scale(0.65)">
        <polygon points="0,-10 3,-3 10,0 3,3 0,10 -3,3 -10,0 -3,-3" fill="#FFFFFF" stroke="#94A3B8" stroke-width="0.8" />
      </g>
      <g transform="translate(175, 225) scale(0.75)">
        <polygon points="0,-10 3,-3 10,0 3,3 0,10 -3,3 -10,0 -3,-3" fill="#FFFFFF" stroke="#94A3B8" stroke-width="0.8" />
      </g>

      <!-- Sparkle cross points -->
      <g transform="translate(180, 110) scale(0.7)">
        <path d="M0,15 Q15,15 15,0 Q15,15 30,15 Q15,15 15,30 Q15,15 0,15" fill="#FFFFFF" />
      </g>
      <g transform="translate(110, 135) scale(0.55)">
        <path d="M0,15 Q15,15 15,0 Q15,15 30,15 Q15,15 15,30 Q15,15 0,15" fill="#FFFFFF" />
      </g>
      <g transform="translate(145, 230) scale(0.75)">
        <path d="M0,15 Q15,15 15,0 Q15,15 30,15 Q15,15 15,30 Q15,15 0,15" fill="#FFFFFF" />
      </g>

      <!-- Shimmer specs -->
      <circle cx="160" cy="145" r="1.5" fill="#FFFFFF" />
      <circle cx="130" cy="165" r="1.3" fill="#E2E8F0" />
      <circle cx="190" cy="190" r="1.6" fill="#FFFFFF" />
      <circle cx="155" cy="205" r="1.2" fill="#FFFFFF" />
      <circle cx="125" cy="220" r="1.4" fill="#CBD5E1" />
    </g>

    <!-- 3D Large Cyber Star Locket (Center Hero Charm) -->
    <g transform="translate(150, 145)" filter="url(#charm-shadow-ss)">
      <!-- Outer metallic star -->
      <polygon points="0,-32 9,-10 32,0 9,10 0,32 -9,10 -32,0 -9,-10" fill="url(#ss-body-grad)" stroke="#FFFFFF" stroke-width="2.2" />
      <!-- Inner star bevel -->
      <polygon points="0,-24 7,-8 24,0 7,8 0,24 -7,8 -24,0 -7,-8" fill="#F8FAFC" opacity="0.75" />
      <!-- Center jewel mount -->
      <circle cx="0" cy="0" r="9" fill="#0F172A" stroke="#FFFFFF" stroke-width="1.5" />
      <circle cx="0" cy="0" r="6" fill="#FF4DB8" />
      <circle cx="-2" cy="-2" r="2" fill="#FFFFFF" opacity="0.9" />
    </g>

    <!-- Liquid Metal Dripping Ribbon Arc -->
    <path d="M100,195 Q130,175 160,205 T200,200" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.8" filter="url(#charm-shadow-ss)" />

    <!-- Mirror Reflection High-Gloss Streak -->
    <path d="M88,27 L165,27 L110,257 L88,257 Z" fill="url(#mirror-streak)" pointer-events="none" />
    <path d="M175,27 L205,27 L170,257 L140,257 Z" fill="url(#mirror-streak)" opacity="0.4" pointer-events="none" />
    
    <!-- Edge Bevel Glint -->
    <path d="M90,40 C90,32 96,27 105,27 L180,27" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.9" />
  </g>
</svg>
