<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <!-- Obsidian Black Shading -->
    <linearGradient id="mg-body-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#27272A" />
      <stop offset="40%" stop-color="#18181B" />
      <stop offset="80%" stop-color="#09090B" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>

    <linearGradient id="mg-bevel" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#71717A" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#3F3F46" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#18181B" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="chrome-shine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="30%" stop-color="#E2E8F0" />
      <stop offset="60%" stop-color="#64748B" />
      <stop offset="100%" stop-color="#F8FAFC" />
    </linearGradient>

    <filter id="mg-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#FF4DB8" flood-opacity="0.35" />
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <filter id="charm-shadow-mg" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#000000" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- Ground reflection shadow -->
  <ellipse cx="150" cy="280" rx="65" ry="10" fill="#000000" opacity="0.3" filter="blur(6px)" />

  <!-- Phone Case Group -->
  <g transform="translate(150, 142) rotate(4) translate(-150, -142)" filter="url(#mg-shadow)">
    
    <!-- Case Base -->
    <rect x="85" y="24" width="130" height="236" rx="28" fill="url(#mg-body-grad)" stroke="url(#mg-bevel)" stroke-width="3.5" />

    <!-- Inner bumper lip -->
    <rect x="88" y="27" width="124" height="230" rx="25" fill="none" stroke="#52525B" stroke-width="1.2" opacity="0.5" />

    <!-- Camera Plateau (iPhone Pro Triple Camera) -->
    <g transform="translate(93, 32)">
      <rect x="0" y="0" width="56" height="58" rx="14" fill="#18181B" stroke="#3F3F46" stroke-width="1.8" />
      <!-- Camera 1 -->
      <circle cx="17" cy="17" r="10" fill="#09090B" stroke="#71717A" stroke-width="2" />
      <circle cx="17" cy="17" r="5" fill="#3B82F6" opacity="0.8" />
      <circle cx="15" cy="15" r="2" fill="#FFFFFF" opacity="0.9" />
      <!-- Camera 2 -->
      <circle cx="17" cy="41" r="10" fill="#09090B" stroke="#71717A" stroke-width="2" />
      <circle cx="17" cy="41" r="5" fill="#3B82F6" opacity="0.8" />
      <circle cx="15" cy="39" r="2" fill="#FFFFFF" opacity="0.9" />
      <!-- Camera 3 -->
      <circle cx="39" cy="29" r="10" fill="#09090B" stroke="#71717A" stroke-width="2" />
      <circle cx="39" cy="29" r="5" fill="#3B82F6" opacity="0.8" />
      <circle cx="37" cy="27" r="2" fill="#FFFFFF" opacity="0.9" />
      <!-- Flash & Sensor -->
      <circle cx="39" cy="12" r="3.5" fill="#FEF08A" stroke="#FFFFFF" stroke-width="1" />
      <circle cx="39" cy="47" r="2" fill="#27272A" />
    </g>

    <!-- High-Contrast Cosmic Prism Glitter Flakes -->
    <g opacity="0.95">
      <!-- Prism Flakes -->
      <polygon points="170,105 178,100 186,105 186,115 178,120 170,115" fill="#FF4DB8" />
      <polygon points="120,130 127,126 134,130 134,138 127,142 120,138" fill="#38BDF8" />
      <polygon points="175,165 184,160 193,165 193,175 184,180 175,175" fill="#FACC15" />
      <polygon points="105,185 112,181 119,185 119,193 112,197 105,193" fill="#A855F7" />
      <polygon points="145,215 153,210 161,215 161,225 153,230 145,225" fill="#22C55E" />
      <polygon points="180,230 186,226 192,230 192,238 186,242 180,238" fill="#FF4DB8" />
      
      <!-- Starlight Chrome Stars -->
      <g transform="translate(180, 80) scale(0.7)">
        <polygon points="0,-12 3.5,-3.5 12,0 3.5,3.5 0,12 -3.5,3.5 -12,0 -3.5,-3.5" fill="#FFFFFF" />
      </g>
      <g transform="translate(115, 155) scale(0.6)">
        <polygon points="0,-12 3.5,-3.5 12,0 3.5,3.5 0,12 -3.5,3.5 -12,0 -3.5,-3.5" fill="#FFFFFF" />
      </g>
      <g transform="translate(185, 200) scale(0.75)">
        <polygon points="0,-12 3.5,-3.5 12,0 3.5,3.5 0,12 -3.5,3.5 -12,0 -3.5,-3.5" fill="#FFFFFF" />
      </g>
      
      <!-- Sparkle cross points -->
      <g transform="translate(160, 140) scale(0.75)">
        <path d="M0,15 Q15,15 15,0 Q15,15 30,15 Q15,15 15,30 Q15,15 0,15" fill="#FFFFFF" />
      </g>
      <g transform="translate(125, 230) scale(0.65)">
        <path d="M0,15 Q15,15 15,0 Q15,15 30,15 Q15,15 15,30 Q15,15 0,15" fill="#FF4DB8" />
      </g>

      <!-- Silver Dust -->
      <circle cx="140" cy="100" r="1.5" fill="#FFFFFF" />
      <circle cx="170" cy="130" r="1.5" fill="#F8FAFC" />
      <circle cx="130" cy="170" r="1.5" fill="#FFFFFF" />
      <circle cx="165" cy="180" r="1.5" fill="#38BDF8" />
      <circle cx="140" cy="200" r="1.5" fill="#FFFFFF" />
    </g>

    <!-- 3D Chrome Sculpted Star Emblem (Center Hero Charm) -->
    <g transform="translate(150, 150)" filter="url(#charm-shadow-mg)">
      <polygon points="0,-28 8,-9 28,0 8,9 0,28 -8,9 -28,0 -8,-9" fill="url(#chrome-shine)" stroke="#FFFFFF" stroke-width="2" />
      <circle cx="0" cy="0" r="8" fill="#FF4DB8" stroke="#FFFFFF" stroke-width="1.5" />
      <circle cx="-2" cy="-2" r="2.5" fill="#FFFFFF" opacity="0.9" />
    </g>

    <!-- Glossy Specular Diagonal Glass Reflection -->
    <path d="M88,27 L175,27 L115,257 L88,257 Z" fill="#FFFFFF" opacity="0.18" pointer-events="none" />
    <path d="M90,40 C90,32 96,27 105,27 L180,27" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.75" />
  </g>
</svg>
